services:
    coap-calculator-simple:
        image: thingweb/test-things-coap-calculator-simple
        labels:
            - traefik.udp.routers.coap-calculator-simple.entrypoints=coap-calculator-simple
            - traefik.udp.services.coap-calculator-simple.loadbalancer.server.port=${COAP_SIMPLE_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${COAP_SIMPLE_PORT_OUT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 50M
                reservations:
                    cpus: "0.01"
                    memory: 25M
        networks:
            - things_network
    coap-calculator-content-negotiation:
        image: thingweb/test-things-coap-calculator-content-negotiation
        labels:
            - traefik.udp.routers.coap-calculator-content-negotiation.entrypoints=coap-calculator-content-negotiation
            - traefik.udp.services.coap-calculator-content-negotiation.loadbalancer.server.port=${COAP_NEGOTIATION_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${COAP_NEGOTIATION_PORT_OUT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 50M
                reservations:
                    cpus: "0.01"
                    memory: 25M
        networks:
            - things_network
    http-express-calculator-simple:
        image: thingweb/test-things-http-express-calculator-simple
        labels:
            - traefik.http.routers.http-express-calculator-simple.rule=PathPrefix(`/http-express-calculator-simple`)
            - traefik.http.routers.http-express-calculator-simple.entrypoints=web
            - traefik.http.routers.http-express-calculator-simple-secure.rule=PathPrefix(`/http-express-calculator-simple`)
            - traefik.http.routers.http-express-calculator-simple-secure.entrypoints=websecure
            - traefik.http.routers.http-express-calculator-simple-secure.tls=true
            - traefik.http.services.http-express-calculator-simple.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
            - LOKI_HOSTNAME=${LOKI_HOSTNAME}
            - LOKI_PORT=${LOKI_PORT}
            - LOKI_PROTOCOL=http
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                    pids: 250
                reservations:
                    cpus: "0.01"
                    memory: 128M
        healthcheck:
            test: wget --no-verbose --tries=1 --spider https://${STACK_HOSTNAME}:${SECURE_WEB_PORT_OUT}/http-express-calculator-simple
            interval: ${HC_INTERVAL}
            timeout: ${HC_TIMEOUT}
            retries: ${HC_RETRIES}
            start_period: ${HC_START_PERIOD}
        networks:
            - things_network
    http-express-calculator-content-negotiation:
        image: thingweb/test-things-http-express-calculator-content-negotiation
        labels:
            - traefik.http.routers.http-express-calculator-content-negotiation.rule=PathPrefix(`/http-express-calculator-content-negotiation`)
            - traefik.http.routers.http-express-calculator-content-negotiation.entrypoints=web
            - traefik.http.routers.http-express-calculator-content-negotiation-secure.rule=PathPrefix(`/http-express-calculator-content-negotiation`)
            - traefik.http.routers.http-express-calculator-content-negotiation-secure.entrypoints=websecure
            - traefik.http.routers.http-express-calculator-content-negotiation-secure.tls=true
            - traefik.http.services.http-express-calculator-content-negotiation.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                    pids: 250
                reservations:
                    cpus: "0.01"
                    memory: 128M
        healthcheck:
            test: wget --no-verbose --tries=1 --spider https://${STACK_HOSTNAME}:${SECURE_WEB_PORT_OUT}/http-express-calculator-content-negotiation
            interval: ${HC_INTERVAL}
            timeout: ${HC_TIMEOUT}
            retries: ${HC_RETRIES}
            start_period: ${HC_START_PERIOD}
        networks:
            - things_network
    http-flask-calculator:
        image: thingweb/test-things-flask-calculator
        labels:
            - traefik.http.routers.http-flask-calculator.rule=PathPrefix(`/http-flask-calculator`)
            - traefik.http.routers.http-flask-calculator.entrypoints=web
            - traefik.http.routers.http-flask-calculator-secure.rule=PathPrefix(`/http-flask-calculator`)
            - traefik.http.routers.http-flask-calculator-secure.entrypoints=websecure
            - traefik.http.routers.http-flask-calculator-secure.tls=true
            - traefik.http.services.http-flask-calculator.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        healthcheck:
            test: wget --no-verbose --tries=1 --spider https://${STACK_HOSTNAME}:${SECURE_WEB_PORT_OUT}/http-flask-calculator
            interval: ${HC_INTERVAL}
            timeout: ${HC_TIMEOUT}
            retries: ${HC_RETRIES}
            start_period: ${HC_START_PERIOD}
        networks:
            - things_network
    mqtt-calculator:
        image: thingweb/test-things-mqtt-calculator
        environment:
            - BROKER_URI=${BROKER_URI}
            - LOKI_HOSTNAME=${LOKI_HOSTNAME}
            - LOKI_PORT=${LOKI_PORT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 50M
                reservations:
                    cpus: "0.01"
                    memory: 25M
        networks:
            - things_network
    modbus-elevator:
        image: thingweb/test-things-modbus-elevator
        labels:
            - traefik.tcp.routers.modbus-elevator.entrypoints=modbus-elevator
            - traefik.tcp.routers.modbus-elevator.rule=HostSNI(`*`)
            - traefik.tcp.services.modbus-elevator.loadbalancer.server.port=${MODBUS_ELEVATOR_PORT_OUT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 50M
                reservations:
                    cpus: "0.01"
                    memory: 25M
        networks:
            - things_network
    http-advanced-coffee-machine:
        image: thingweb/test-things-http-advanced-coffee-machine
        labels:
            - traefik.http.routers.http-advanced-coffee-machine.rule=PathPrefix(`/http-advanced-coffee-machine`)
            - traefik.http.routers.http-advanced-coffee-machine.entrypoints=web
            - traefik.http.routers.http-advanced-coffee-machine-secure.rule=PathPrefix(`/http-advanced-coffee-machine`)
            - traefik.http.routers.http-advanced-coffee-machine-secure.entrypoints=websecure
            - traefik.http.routers.http-advanced-coffee-machine-secure.tls=true
            - traefik.http.services.http-advanced-coffee-machine.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
            - JAEGER_ENDPOINT=${JAEGER_ENDPOINT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network
    http-data-schema-thing:
        image: thingweb/test-things-http-data-schema-thing
        labels:
            - traefik.http.routers.http-data-schema-thing.rule=PathPrefix(`/http-data-schema-thing`)
            - traefik.http.routers.http-data-schema-thing.entrypoints=web
            - traefik.http.routers.http-data-schema-thing-secure.rule=PathPrefix(`/http-data-schema-thing`)
            - traefik.http.routers.http-data-schema-thing-secure.entrypoints=websecure
            - traefik.http.routers.http-data-schema-thing-secure.tls=true
            - traefik.http.services.http-data-schema-thing.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
            - LOKI_HOSTNAME=${LOKI_HOSTNAME}
            - LOKI_PORT=${LOKI_PORT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network
    counter-thing:
        image: thingweb/test-things-counter
        labels:
            - traefik.http.routers.counter-thing.rule=Host(`${STACK_HOSTNAME}`) && PathPrefix(`/counter`)
            - traefik.http.routers.counter-thing.entrypoints=web
            - traefik.http.routers.counter-thing.priority=100
            - traefik.http.routers.counter-thing-secure.rule=Host(`${STACK_HOSTNAME}`) && PathPrefix(`/counter`)
            - traefik.http.routers.counter-thing-secure.entrypoints=websecure
            - traefik.http.routers.counter-thing-secure.tls=true
            - traefik.http.services.counter-thing.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            - HOSTNAME=${STACK_HOSTNAME}
            - PORT=${SECURE_WEB_PORT_OUT}
            - EXTERNAL_PORT=${SECURE_WEB_PORT_OUT}
            - PROTOCOL=https
            - LOKI_HOSTNAME=${LOKI_HOSTNAME}
            - LOKI_PORT=${LOKI_PORT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network
    smart-home-presence-sensor:
        image: thingweb/test-things-smart-home-presence-sensor
        restart: on-failure
        environment:
            - PRESENCE_SENSOR_BROKER_URI=${BROKER_URI}
            - PRESENCE_SENSOR_BROKER_PORT=${BROKER_PORT}
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network
    smart-home-simple-coffee-machine:
        image: thingweb/test-things-smart-home-simple-coffee-machine
        labels:
            # TD is not exposed since it contains hostname that cannot be accessed outside the docker network
            - traefik.http.routers.smart-home-simple-coffee-machine.rule=PathRegexp(`/smart-home-simple-coffee-machine/.+`)
            - traefik.http.routers.smart-home-simple-coffee-machine.entrypoints=web
            - traefik.http.routers.smart-home-simple-coffee-machine-secure.rule=PathPrefix(`/smart-home-simple-coffee-machine`)
            - traefik.http.routers.smart-home-simple-coffee-machine-secure.entrypoints=websecure
            - traefik.http.routers.smart-home-simple-coffee-machine-secure.tls=true
            - traefik.http.services.smart-home-simple-coffee-machine.loadbalancer.server.port=${SECURE_WEB_PORT_OUT}
        environment:
            # Since mashup communicates inside the Docker network use of localhost in a TD result as
            # the mashup container's its own localhost. Therefore hostname given as their docker service name.
            # In production we will have a dedicated address and this issue won't be a problem.
            - SIMPLE_COFFEE_MACHINE_PROTOCOL=https
            - SIMPLE_COFFEE_MACHINE_HOSTNAME=${STACK_HOSTNAME}
            - SIMPLE_COFFEE_MACHINE_PORT=${SECURE_WEB_PORT_OUT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network
    smart-home-smart-clock:
        image: thingweb/test-things-smart-home-smart-clock
        labels:
            - traefik.udp.routers.smart-home-smart-clock.entrypoints=smart-home-smart-clock
            - traefik.udp.services.smart-home-smart-clock.loadbalancer.server.port=${SMART_HOME_SMART_CLOCK_PORT_OUT}
        environment:
            # Since mashup communicates inside the Docker network use of localhost in a TD result as
            # the mashup container's its own localhost. Therefore hostname given as their docker service name.
            # In production we will have a dedicated address and this issue won't be a problem.
            - SMART_CLOCK_HOSTNAME=smart-home-smart-clock
            - SMART_CLOCK_PORT=${SMART_HOME_SMART_CLOCK_PORT_OUT}
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 200M
                reservations:
                    cpus: "0.01"
                    memory: 50M
        networks:
            - things_network
    smart-home-mashup:
        image: thingweb/test-things-smart-home-main
        environment:
            - SIMPLE_COFFEE_MACHINE_PROTOCOL=https
            - SIMPLE_COFFEE_MACHINE_HOSTNAME=${STACK_HOSTNAME}
            - SIMPLE_COFFEE_MACHINE_PATH=smart-home-simple-coffee-machine
            - SIMPLE_COFFEE_MACHINE_PORT=${SECURE_WEB_PORT_OUT}
            - PRESENCE_SENSOR_BROKER_URI=${BROKER_URI}
            - PRESENCE_SENSOR_PORT=${BROKER_PORT}
            - SMART_CLOCK_HOSTNAME=smart-home-smart-clock
            - SMART_CLOCK_PORT=${SMART_HOME_SMART_CLOCK_PORT_OUT}
        depends_on:
            - smart-home-presence-sensor
            - smart-home-simple-coffee-machine
            - smart-home-smart-clock
        restart: on-failure
        deploy:
            resources:
                limits:
                    cpus: "0.05"
                    memory: 256M
                reservations:
                    cpus: "0.01"
                    memory: 128M
        networks:
            - things_network

networks:
    things_network:
        name: things_network
        external: true
